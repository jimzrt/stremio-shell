name: Flatpak downmix release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name
        required: false
        default: "4.4.183"

permissions:
  contents: write

env:
  VERSION_NAME: ${{ inputs.version_name }}

jobs:
  build:
    name: Build and publish Flatpak
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/downmix
          submodules: recursive

      - name: Add deployment metadata
        run: |
          git fetch --no-tags origin feature/downmix-aur
          git show FETCH_HEAD:flatpak/assets/com.stremio.Stremio.appdata.xml > flatpak/assets/com.stremio.Stremio.appdata.xml

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak
        run: |
          set -euo pipefail
          sudo flatpak-builder \
            --repo=stremio-flatpak-repo \
            --install-deps-from=flathub \
            --force-clean \
            _build com.stremio.Stremio.json

      - name: Pack Flatpak
        run: |
          set -euo pipefail
          flatpak build-bundle \
            stremio-flatpak-repo \
            "Stremio-${VERSION_NAME}.flatpak" \
            com.stremio.Stremio beta
          sha256sum "Stremio-${VERSION_NAME}.flatpak" > "Stremio-${VERSION_NAME}-SHA256SUMS.txt"

      - name: Store Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: StremioFlatpak
          path: |
            Stremio-${{ env.VERSION_NAME }}.flatpak
            Stremio-${{ env.VERSION_NAME }}-SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="downmix-${VERSION_NAME}"
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target feature/downmix \
              --title "Stremio downmix ${VERSION_NAME}" \
              --notes "Flatpak bundle for the UI-selectable dialogue downmix feature."
          fi
          gh release upload "${tag}" \
            "Stremio-${VERSION_NAME}.flatpak" \
            "Stremio-${VERSION_NAME}-SHA256SUMS.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
